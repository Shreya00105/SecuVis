<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    
    {% extends "layout.html" %}
{% block content %}

<div style="max-width:380px; margin:80px auto; background:#1e293b; padding:35px; border-radius:16px; border:1px solid #334155;">
    
    <h2 style="color:#38bdf8; margin-bottom:20px;">Login to SecuVis</h2>

    <form method="POST">

        <label>Username</label>
        <input type="text" name="username" required
        style="width:100%; padding:10px; margin:8px 0 18px; border-radius:8px; border:none;">

        <label>Password</label>
        <input type="password" name="password" required
        style="width:100%; padding:10px; margin:8px 0 18px; border-radius:8px; border:none;">

        {% if error %}
        <p style="color:rgb(239,68,68); margin-bottom:10px;">{{ error }}</p>
        {% endif %}

        <button class="btn btn-primary" style="width:100%;">Login</button>

    </form>

</div>

{% endblock %}

</body>
</html>
